{% extends "base.html" %}
{% block title %}Gestão • Login{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-12 col-lg-5">
    <div class="glass-card">
      <div class="d-flex align-items-center gap-3 mb-3">
        <div class="hero-icon">
          <i class="bi bi-shield-lock"></i>
        </div>
        <div>
          <h1 class="h4 mb-0">Gestão</h1>
          <div class="text-white-50">Entre com a senha para acessar os resultados e gerenciar tutores.</div>
        </div>
      </div>

      <form id="formLogin" class="mt-3">
        <label class="form-label">Senha</label>
        <div class="input-group input-group-lg">
          <span class="input-group-text"><i class="bi bi-key"></i></span>
          <input id="senha" type="password" class="form-control" placeholder="Digite a senha" required />
          <button class="btn btn-outline-light" type="button" id="toggleSenha"><i class="bi bi-eye"></i></button>
        </div>

        <div class="d-grid mt-3">
          <button class="btn btn-primary btn-lg rounded-pill" type="submit">
            <i class="bi bi-box-arrow-in-right"></i> Entrar
          </button>
        </div>

        <div class="mt-3">
          <div id="msg" class="alert d-none" role="alert"></div>
        </div>

        <div class="small text-white-50 mt-3">
          Segurança: defina uma senha forte no Render usando a variável <span class="badge text-bg-dark">ADMIN_PASSWORD</span>.
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='admin_login.js') }}"></script>
{% endblock %}
