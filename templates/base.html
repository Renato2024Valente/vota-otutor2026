<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>{{ title if title else "Votação de Tutores 2026" }}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
  <div class="container">
    <a class="navbar-brand fw-semibold" href="{{ url_for('index') }}">Monsenhor Bicudo • Votação Tutores 2026</a>
    <div class="d-flex gap-2">
      {% if session.get("admin") %}
        <a class="btn btn-sm btn-outline-light" href="{{ url_for('gestao') }}">Gestão</a>
        <a class="btn btn-sm btn-light" href="{{ url_for('gestao_logout') }}">Sair</a>
      {% else %}
        <a class="btn btn-sm btn-outline-light" href="{{ url_for('gestao_login_page') }}">Gestão</a>
      {% endif %}
    </div>
  </div>
</nav>

<main class="container py-4">
  {% block content %}{% endblock %}
</main>

<footer class="py-4">
  <div class="container text-center small text-muted">
    Sistema de Votação • 2026 • Prof. Renato Valente
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
