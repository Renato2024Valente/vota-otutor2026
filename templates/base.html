<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title or "Votação de Tutores 2026" }}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: radial-gradient(1200px 600px at 10% 10%, rgba(13,110,253,.18), transparent 60%),
                  radial-gradient(900px 500px at 90% 20%, rgba(25,135,84,.16), transparent 55%),
                  #0b1220;
      color: #e9eef7;
      min-height: 100vh;
    }
    .card-glass {
      background: rgba(255,255,255,.06);
      border: 1px solid rgba(255,255,255,.10);
      backdrop-filter: blur(10px);
      border-radius: 18px;
    }
    .muted { color: rgba(233,238,247,.75); }
    .btn-big { padding: .9rem 1rem; font-size: 1.05rem; border-radius: 14px; }
    .form-control, .form-select {
      background: rgba(255,255,255,.06);
      border: 1px solid rgba(255,255,255,.14);
      color: #e9eef7;
      border-radius: 14px;
    }
    .form-control:focus, .form-select:focus {
      box-shadow: 0 0 0 .25rem rgba(13,110,253,.25);
      border-color: rgba(13,110,253,.6);
    }
    option { color: #0b1220; }
    .badge-soft {
      background: rgba(13,110,253,.18);
      border: 1px solid rgba(13,110,253,.35);
      color: #cfe3ff;
    }
    .listbox {
      max-height: 220px; overflow: auto;
      background: rgba(255,255,255,.04);
      border: 1px solid rgba(255,255,255,.10);
      border-radius: 14px;
      padding: .6rem .7rem;
    }
    .small-note { font-size: .9rem; }
  </style>
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark px-2 px-md-4">
    <div class="container-fluid">
      <a class="navbar-brand fw-semibold" href="/">Bicudo • Votação de Tutores 2026</a>
      <div class="d-flex gap-2">
        <a class="btn btn-sm btn-outline-light" href="/admin">Gestão</a>
      </div>
    </div>
  </nav>

  <main class="container py-4">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="alert alert-{{ category }} card-glass border-0">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
