{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6 col-lg-5">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h1 class="h5 mb-3">Acesso da Gestão</h1>
        <p class="text-muted">Digite a senha para acessar o painel.</p>

        {% if erro %}
          <div class="alert alert-danger">{{ erro }}</div>
        {% endif %}

        <form method="post" action="{{ url_for('gestao_login') }}">
          <div class="mb-3">
            <label class="form-label">Senha</label>
            <input type="password" class="form-control" name="senha" required>
          </div>
          <div class="d-grid">
            <button class="btn btn-primary" type="submit">Entrar</button>
          </div>
        </form>

        <div class="mt-3 small text-muted">
          Dica: configure a senha no Render com a variável <code>ADMIN_PASSWORD</code>.
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
